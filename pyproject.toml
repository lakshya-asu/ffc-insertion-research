[project]
name = "ffc-insertion-research"
version = "0.1.0"
description = "FR3 workcell geometry and benchmark development for desk-to-PCB FFC assembly"
requires-python = ">=3.11"
dependencies = [
    "mujoco==3.12.0",
    "numpy>=2.0",
    "pillow>=11",
    "scipy==1.17.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
    "ruff>=0.12",
    "usd-core==26.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
